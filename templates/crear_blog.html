{% extends "base.html" %}
{% block title %}Crear Blog{% endblock %}

{% block content %}

<body>
    <!-- Main Content -->
    <form action="{{url_for('admin.crear_nuevo_blog')}}" method="post" enctype="multipart/form-data">
        <main class="container-xxl mt-5 pt-5">
            <!-- Header Area -->
            <div class="row align-items-end mb-5 gy-4">
                <div class="col-lg-8">
                    <span class="form-label-brand mb-2 d-block">Nueva Entrada</span>
                    <input class="form-control form-control-title" name="titulo_blog" placeholder="Cargar título del blog" type="text" />
                </div>
            </div>
            </header>
            <div class="row g-5">
                <!-- Main Column -->
                <div class="col-lg-8">
                    <div class="mb-5">
                        <div class="hero-uploader" id="drop-zone" style="position: relative; overflow: hidden; cursor: pointer;">
                            <div id="uploader-content" class="d-flex flex-column align-items-center">
                                <span class="material-symbols-outlined fs-1 text-secondary mb-2">add_photo_alternate</span>
                                <span class="font-headline fw-bold fs-5">Agregar imagen de portada</span>
                                <span class="text-muted small mt-1">Tamaño recomendado: 2400x1200px</span>
                            </div>

                            <img id="preview-img" src="" class="d-none" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;">
                            
                            <input type="file" id="hero-input" name="hero_image" accept="image/*" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; z-index: 2; cursor: pointer;">
                        </div>
                    </div>
                    <div class="editor-container">
                        <textarea class="editor-textarea" name="descripcion" id="descripcion"
                            placeholder="Ingresa una breve descripcion" id="descripcion"></textarea>
                    </div>
                    <div class="editor-container">
                        <textarea class="editor-textarea" name="editor_textarea" id="editor_textarea"
                            placeholder="Escribe tu blog." id="editor-textarea"></textarea>
                    </div>
                </div>
                <!-- Sidebar Column -->
                <div class="col-lg-4">
                    <div class="sidebar-sticky">
                        <div class="card-logistics mb-4">
                            <h4 class="font-headline fw-bold text-primary mb-4 pb-3 border-bottom border-light">Datos de la excursion</h4>
                            <!-- Difficulty -->
                            <div class="mb-4">
                                <label class="form-label-brand mb-3 d-block">Dificultad</label>
                                <div class="btn-group" role="group" aria-label="Basic radio toggle button group">
                                    <input type="radio" class="btn-check" name="btnradio" id="btnradio1" value="Facil" checked>
                                    <label class="btn btn-outline-primary" for="btnradio1">Facil</label>

                                    <input type="radio" class="btn-check" name="btnradio" id="btnradio2" value="Media">
                                    <label class="btn btn-outline-primary" for="btnradio2">Media</label>

                                    <input type="radio" class="btn-check" name="btnradio" id="btnradio3" value="Dificil">
                                    <label class="btn btn-outline-primary" for="btnradio3">Dificil</label>
                                </div>
                            </div>
                            <!-- Location -->
                            <div class="mb-4">
                                <label class="form-label-brand mb-2 d-block">Ubicación</label>
                                <div class="input-group">
                                    <span class="input-group-text border-0 bg-secondary-subtle px-2">
                                        <span class="material-symbols-outlined text-secondary">location_on</span>
                                    </span>
                                    <input class="form-control form-control-brand" name="ubicacion_blog" placeholder="Ej. Cerro Champaqui, Córdoba"
                                        type="text" />
                                </div>
                            </div>
                            <!-- Duration & Elevation -->
                            <div class="row g-3 mb-4">
                                <div class="col-6">
                                    <label class="form-label-brand mb-2 d-block">Duración</label>
                                    <input class="form-control form-control-brand" name="duracion_expedicion" placeholder="4-5 days" type="text" />
                                </div>
                                <div class="col-6">
                                    <label class="form-label-brand mb-2 d-block">MSNM</label>
                                    <input class="form-control form-control-brand" name="msnm" placeholder="2,400m" type="text" />
                                </div>
                                <div class="col-6">
                                    <label class="form-label-brand mb-2 d-block">Km total</label>
                                    <input class="form-control form-control-brand" name="km_total" placeholder="2,400m" type="text" />
                                </div>
                                <div class="col-6">
                                    <label class="form-label-brand mb-2 d-block">punto de inicio</label>
                                    <input class="form-control form-control-brand" name="punto_inicio" placeholder="Villa alpina" type="text" />
                                </div>

                            </div>
                            <div class="row g-3 mb-4">
                                <h5 class="mb-4 font-headline fw-bold text-primary mb-4 pb-3 border-bottom border-light">Datos extras</h4>
                                <div class="col-6">
                                    <label class="form-label-brand mb-2 d-block">Autor</label>
                                    <input class="form-control form-control-brand" name="autor" placeholder="nombre" type="text" />
                                </div>
                                <div class="col-6">
                                    <label class="form-label-brand mb-2 d-block">Fecha</label>
                                    <input class="form-control form-control-brand" name="fecha" placeholder="fecha publicacion" type="text" />
                                </div>
                            </div>
                            <div class="d-flex gap-3 justify-content-lg-end">
                                <button type="submit" class="trekking_cba_boton botones btn-guardar-blog">GUARDAR BLOG</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </form>

</body>

<!-- Bootstrap (MUY IMPORTANTE) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>


<script>
ClassicEditor
    .create(document.querySelector('#editor_textarea'), {
        extraPlugins: [ MyCustomUploadAdapterPlugin ]
    })
    .then(editor => {
        window.editor = editor;
    })
    .catch(error => {
        console.error(error);
    });

// 🔥 ESTE ES EL FIX
function MyCustomUploadAdapterPlugin(editor) {
    editor.plugins.get('FileRepository').createUploadAdapter = (loader) => {
        return new MyUploadAdapter(loader);
    };
}

class MyUploadAdapter {
    constructor(loader) {
        this.loader = loader;
    }

    upload() {
        return this.loader.file.then(file => new Promise((resolve, reject) => {
            const data = new FormData();
            data.append('upload', file);

            fetch('/admin/upload-image', {
                method: 'POST',
                body: data
            })
            .then(response => response.json())
            .then(result => {
                resolve({
                    default: result.url // 🔥 IMPORTANTE
                });
            })
            .catch(error => {
                reject(error);
            });
        }));
    }

    abort() {}
}
</script>
<script>
    document.getElementById('hero-input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    const preview = document.getElementById('preview-img');
    const content = document.getElementById('uploader-content');

    if (file) {
        const reader = new FileReader();

        reader.onload = function(event) {
            // Asignar la imagen y mostrarla
            preview.src = event.target.result;
            preview.classList.remove('d-none');
            
            // Opcional: Ocultar el texto original para que solo se vea la imagen
            content.classList.add('d-none');
        }

        reader.readAsDataURL(file);
    }
});
</script>
</html>
{%endblock%}
